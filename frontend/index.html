<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mars EVA Planner - Mount Sharp boxwork</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23c1440e'/%3E%3Ccircle cx='11' cy='12' r='3' fill='%23a13508'/%3E%3Ccircle cx='20' cy='20' r='4' fill='%23a13508'/%3E%3C/svg%3E" />
  </head>
  <body>
    <!-- A full-screen map with one floating panel, in the manner of a consumer maps app. -->
    <div id="app">
      <div id="map" aria-label="Map of the walking area"></div>

      <aside id="panel" class="panel" aria-label="Your walk">
        <header class="panel-head">
          <span class="brand-mark" aria-hidden="true"></span>
          <div class="brand-text">
            <h1>Mars EVA Planner</h1>
            <p>Plan a safe walk on Mars</p>
          </div>
          <button id="about-button" class="icon-button" type="button" title="How it works" aria-label="How it works"></button>
        </header>

        <!-- The walk: verdict, route summary and stops, then details that open on request. -->
        <div id="view-walk" class="view">
          <div id="verdict" role="status" aria-live="polite"></div>
          <section id="plan"></section>
          <div id="sections"></div>
        </div>

        <!-- A place: photos Curiosity took nearby. Shown instead of the walk when asked for. -->
        <div id="view-place" class="view" hidden></div>
      </aside>

      <button id="panel-toggle" type="button" title="Hide the panel" aria-label="Hide the panel" aria-expanded="true"></button>
      <div id="chips" class="chips-bar"></div>
    </div>
    <dialog id="about" class="about"></dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
